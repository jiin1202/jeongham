name: scrape-oliveyoung
on:
  workflow_dispatch:
    inputs:
      max:
        description: "max detail requests"
        default: "600"
  push:
    branches: [scrape-run]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 scripts/scrape_oy.py scripts/raw2.json ${{ github.event.inputs.max || '5' }}
      - name: Commit data
        run: |
          git config user.name "jeongham-bot"
          git config user.email "noreply@github.com"
          git add scripts/raw2.json
          git commit -m "data: 올리브영 추가 수집 결과" || echo "nothing"
          git push
